services:
  warehouse:
    build:
      context: .
    image: warehouse-inventory:latest
    container_name: warehouse-inventory
    restart: unless-stopped
    ports:
      - "${WAREHOUSE_PORT:-8088}:8088"
    environment:
      WAREHOUSE_ENV: production
      WAREHOUSE_HOST: 0.0.0.0
      WAREHOUSE_PORT: 8088
      WAREHOUSE_TUNNEL: "0"
      WAREHOUSE_OPEN_BROWSER: "0"
      WAREHOUSE_DATA_DIR: /app/data
      WAREHOUSE_DATA_ENCRYPTION: "${WAREHOUSE_DATA_ENCRYPTION:-1}"
      WAREHOUSE_DATA_KEY: "${WAREHOUSE_DATA_KEY:?set WAREHOUSE_DATA_KEY in .env}"
      WAREHOUSE_ADMIN_USER: "${WAREHOUSE_ADMIN_USER:-admin}"
      WAREHOUSE_ADMIN_PASSWORD: "${WAREHOUSE_ADMIN_PASSWORD:-change-this-strong-password}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/login', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
